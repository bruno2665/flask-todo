<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-Liste</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Todo-Liste</h1>

    <form action="{{ url_for('add') }}" method="post" class="add">
      <input type="text" name="title" placeholder="Neue Aufgabe…" required autofocus>
      <button type="submit">Hinzufügen</button>
    </form>

    {% if todos %}
    <ul>
      {% for todo in todos %}
      <li class="{{ 'done' if todo.done }}">
        <form action="{{ url_for('toggle', todo_id=todo.id) }}" method="post">
          <button type="submit" class="check" aria-label="Erledigt umschalten">
            {{ '✔' if todo.done else '○' }}
          </button>
        </form>
        <span>{{ todo.title }}</span>
        <form action="{{ url_for('delete', todo_id=todo.id) }}" method="post">
          <button type="submit" class="del" aria-label="Löschen">✕</button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="empty">Keine Aufgaben. Alles erledigt!</p>
    {% endif %}
  </main>
</body>
</html>
